[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leaf-generator"
version = "0.1.0"
description = "Two packages: leaf_generator (assemble procedural leaf assets for Blender from PBR map sets) and pose_estimator (recover plant 3D structure -- point cloud, skeleton, leaf pose -- from a turntable capture)."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }

dependencies = [
    "numpy",
    "opencv-contrib-python",
    "pillow",
    "scipy",
    "scikit-image",
    "tqdm",
    "rawpy",
    "exifread",
    "imageio",
    "matplotlib",
]

[project.optional-dependencies]
# Needed by main.py / get_mask.py for BiRefNet masking and the Uni-MS-PS
# normal-map estimation submodule.
capture = [
    "torch",
    "torchvision",
]
dev = [
    "pytest",
    "debugpy",
    # Stub package for bpy/bmesh/mathutils IDE autocompletion outside Blender.
    "fake-bpy-module-latest",
]
# Experimental: pose_estimator's skeleton path (video -> plant stem/branch/
# leaf skeleton). pycolmap is a large, self-contained wheel (bundles COLMAP);
# kept out of the base install since most of this repo doesn't need it.
skeleton = [
    "pycolmap",
    "matplotlib",
]
# Same as "skeleton", but with GPU-accelerated SIFT feature extraction
# (pycolmap-cuda instead of pycolmap -- CPU SIFT on phone-camera-sized
# images is easy to OOM-kill with the default thread-per-core extraction).
# After installing, `import pycolmap` may raise "libcudart.so.12: cannot
# open shared object file" if no CUDA runtime is on the system already;
# nvidia-cuda-runtime-cu12 provides one, but its lib/ dir still needs to be
# on LD_LIBRARY_PATH, e.g.:
#   conda env config vars set LD_LIBRARY_PATH=$(python -c \
#     "import nvidia.cuda_runtime as m, os; print(os.path.join(m.__path__[0], 'lib'))")
# Mutually exclusive with "skeleton"/"splat" (or plain "pycolmap") in the
# same environment -- both packages install into the same `pycolmap`
# importable module, so whichever installs last wins.
skeleton-gpu = [
    "pycolmap-cuda",
    "nvidia-cuda-runtime-cu12",
    "matplotlib",
]
# pose-train-splat -- trains a 3D Gaussian Splat from a "skeleton"
# capture's COLMAP reconstruction, via gsplat. Needs the "skeleton" extra
# too (reads its sparse/best + images/) plus a GPU: install a CUDA-matching
# torch build first, e.g. `pip install torch --index-url
# https://download.pytorch.org/whl/cu118`, since the default PyPI torch
# wheel may target a different CUDA version than what's on the machine --
# gsplat JIT-compiles its CUDA kernels via nvcc against whatever torch/CUDA
# is present at first use.
splat = [
    "torch",
    "gsplat",
    "pytorch-msssim",
]
# pose-segment (P2) -- SAM2 video propagation for plant/holder masks.
# SAM2 itself is NOT installed from PyPI: the `sam2` name there is a
# third-party upload, not facebookresearch's. Install the real one from the
# vendored clone instead:
#   git clone https://github.com/facebookresearch/sam2.git third_party/sam2
#   pip install -e third_party/sam2
# (Apache-2.0, checkpoints included -- see DECISIONS.md.)
# opencv-contrib-python rather than opencv-python: the contrib build is what
# carries cv2.aruco, needed by the ChArUco path in P1.
segment = [
    "torch",
    "torchvision",
    "opencv-contrib-python",
    "matplotlib",
]
# pose-classify / pose-semantic / pose-tips (P4c) -- DINOv2/DINOv3 features
# via transformers. DINOv3 is a gated repo: accept its license on
# huggingface.co and authenticate (`huggingface-cli login`) before first use.
semantic = [
    "torch",
    "transformers",
    "matplotlib",
]
# pose-geometry --backends vggt -- the dependencies imported by VGGT's
# official demo_colmap.py exporter.  Torch is deliberately not pinned to a
# CUDA wheel URL: install a CUDA-matching torch/torchvision build first if
# needed, then this extra will retain it when its version satisfies >=2.3.
# The exporter imports LightGlue even when --bundle-adjust is off.
vggt = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy<2",
    "Pillow",
    "huggingface_hub",
    "einops",
    "safetensors",
    "trimesh",
    "hydra-core",
    "omegaconf",
    "scipy",
    "requests",
    "pydantic==2.10.6",
    "pyceres==2.3",
    "lightglue @ git+https://github.com/jytime/LightGlue.git",
]
# Everything the P1-P6 pipeline needs, in one name, for a machine that will
# run the whole thing. Uses the GPU pycolmap build; swap to "skeleton" for
# the CPU one (they are mutually exclusive -- same `pycolmap` module).
# Note this does NOT install torch: install a CUDA-matching build first
# (see setup_env.sh), or pip resolves whatever the default PyPI wheel
# targets, which may not match the machine's CUDA.
pose-all = [
    "leaf-generator[skeleton-gpu]",
    "leaf-generator[splat]",
    "leaf-generator[segment]",
    "leaf-generator[semantic]",
]

# pose_estimator's phase CLIs. Each reads from and writes to a plant's
# --workdir on disk, so they can be run (and re-run) independently.
[project.scripts]
# P1-P6, in pipeline order.
pose-segment = "pose_estimator.cli.segment:main"      # P1 + P2
pose-pick-prompts = "pose_estimator.cli.pick_prompts:main"  # P2 SAM2 seed picker (GUI)
pose-solve = "pose_estimator.cli.pose:main"           # P3
pose-geometry = "pose_estimator.cli.geometry:main"    # P3 learned backends + comparison
pose-compare-geometry = "pose_estimator.cli.compare_geometry:main" # re-score P3 experiments
pose-hull = "pose_estimator.cli.hull:main"            # P4a
pose-surface = "pose_estimator.cli.surface:main"      # P4b
pose-pick-seeds = "pose_estimator.cli.pick_seeds:main" # P4c seed picker (GUI)
pose-classify = "pose_estimator.cli.classify:main"    # P4c stage 1
pose-fuse = "pose_estimator.cli.fuse:main"            # P4c stage 2
pose-semantic = "pose_estimator.cli.semantic:main"    # P4c, both stages
pose-tips = "pose_estimator.cli.tips:main"            # P4c leaf tips, 2D->3D
pose-structure = "pose_estimator.cli.structure:main"  # P5
pose-leaf = "pose_estimator.cli.leaf_model:main"      # P6
pose-view-structure = "pose_estimator.cli.view_structure:main"  # inspect P5 in 3D

# Finds both top-level packages under src/: leaf_generator and pose_estimator.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
